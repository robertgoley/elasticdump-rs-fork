[package]
name = "elasticdump-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance Elasticsearch data dumper"
authors = ["TenYears <opensource@tenyears.tech>"]
license = "MIT"
repository = "https://github.com/tenyears-tech/elasticdump-rs"

# Test-only tools (TST-INF-005/009) share the lock file; `cargo build`/`test`
# at the root still builds only elasticdump-rs.
[workspace]
members = [".", "tools/edverify", "tools/edgen"]
default-members = ["."]

[lib]
name = "elasticdump_rs"
path = "src/lib.rs"

[package.metadata.cargo-machete]
# rust-ini is imported as `ini` (machete matches on the package name)
ignored = ["rust-ini"]

[[bin]]
name = "elasticdump-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
] }
# Thin HTTP client: full control over endpoints (OpenSearch vs Elasticsearch
# PIT APIs), per-direction headers/params, gzip request bodies and TLS.
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "rustls-tls-manual-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Only to decrypt `--key` files in encrypted PKCS#8 form (feature `encrypted-keys`, on by default).
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"], optional = true }
clap = { version = "4.4", features = ["derive", "wrap_help"] }
# `sanitize`: no SIMD over-read past the end of a string when serialising (L-505: ASan in
# the bulk_encode_doc fuzz target flagged the deliberate same-page tail read in release builds).
# pinned (TST-SUP-022): upgrades must re-run the sonic_vs_serde differential fuzz
sonic-rs = { version = "=0.5.10", features = ["sanitize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
anyhow = "1.0.102"
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
bytes = "1.11.1"
url = "2.4"
base64 = "0.23"
http = "1.3"
bytesize = "2.0"
console = "0.16"
tokio-util = "0.7"
percent-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.14", default-features = false }
memchr = "2"
rust-ini = "0.21"
semver = "1"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"
lipsum = "0.9"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["encrypted-keys"]
# Decrypt encrypted PKCS#8 client keys (`--key` + `--pass`). Pulls in the RustCrypto
# aes/scrypt/pbkdf2/sha2 stack; `--no-default-features` builds leave it out (SUP-023).
encrypted-keys = ["dep:pkcs8"]
# Test tiers (TST-INF-001; .config/nextest.toml). None of these change the shipped binary.
# Podman-backed integration suite (tests/it, tests/integration_test.rs); see scripts/it/run.sh.
it = []
# Long-running tests against a live cluster (load tier; scripts/load/run.sh is the main load harness).
load = ["it"]
# Fault-injection tests (chaos tier).
chaos = []
# cargo-fuzz targets (fuzz/).
fuzz = []
# Deprecated upstream aliases, kept so old command lines still work.
large_scale_test = ["load"]
manual_test = ["load"]

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["it"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["it"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Lighter optimized profile for integration runs and CI: no LTO, parallel
# codegen. Keeps peak build memory low enough to run next to OpenSearch.
[profile.it]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
debug = false
incremental = true
