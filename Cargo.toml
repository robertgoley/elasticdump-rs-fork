[package]
name = "searchdump-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Fast Elasticsearch/OpenSearch dump, restore and copy tool with an elasticdump-compatible CLI (derived from elasticdump-rs)"
authors = ["TenYears <opensource@tenyears.tech>"]
license = "MIT"
repository = "https://github.com/robertgoley/searchdump-rs"
homepage = "https://github.com/robertgoley/searchdump-rs"
# Derived from elasticdump-rs by TenYears (https://github.com/tenyears-tech/elasticdump-rs, MIT).

# Test-only tools (TST-INF-005/009) share the lock file; `cargo build`/`test`
# at the root still builds only searchdump-rs.
[workspace]
members = [".", "tools/edverify", "tools/edgen"]
default-members = ["."]

[lib]
name = "searchdump_rs"
path = "src/lib.rs"

[package.metadata.cargo-machete]
# rust-ini is imported as `ini` (machete matches on the package name)
ignored = ["rust-ini"]

[[bin]]
name = "searchdump"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
] }
# Thin HTTP client: full control over endpoints (OpenSearch vs Elasticsearch
# PIT APIs), per-direction headers/params, gzip request bodies and TLS.
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "rustls-tls-manual-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Only to decrypt `--key` files in encrypted PKCS#8 form (feature `encrypted-keys`, on by default).
pkcs8 = { version = "0.11", features = ["encryption", "pem", "std"], optional = true }
clap = { version = "4.4", features = ["derive", "wrap_help"] }
# `sanitize`: no SIMD over-read past the end of a string when serialising (L-505: ASan in
# the bulk_encode_doc fuzz target flagged the deliberate same-page tail read in release builds).
# pinned (TST-SUP-022): upgrades must re-run the sonic_vs_serde differential fuzz
sonic-rs = { version = "=0.5.10", features = ["sanitize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
anyhow = "1.0.102"
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
bytes = "1.11.1"
url = "2.4"
base64 = "0.22"
http = "1.3"
bytesize = "2.0"
console = "0.16"
tokio-util = "0.7"
percent-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.14", default-features = false }
memchr = "2"
rust-ini = "0.21"
semver = "1"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# Global allocators (L-802a, L-808b; benchmarks: results/local/L-802a.md). glibc Linux builds
# use mimalloc by default (target table below; opt out with `--features system-allocator`);
# musl builds keep musl's own allocator unless a feature asks for one.
tikv-jemallocator = { version = "0.7", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
# Second, separate write/read path for s3://, b2://, sftp://, fs:// URLs (feature `opendal`).
# Pinned exactly (L-809d: 0.59.5, rust-version 1.91); upgrades go through the supply-chain gates.
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
# OpenDAL's own HTTP client version, given our rustls config (same CA/--insecure handling and
# ring provider as the cluster side).
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
# The reqwest transport, constructed per operator with our client (default features would also
# pull rustls' aws-lc provider; the no-provider feature keeps ring only).
opendal-http-transport-reqwest = { version = "=0.59.5", default-features = false, optional = true }
opendal = { version = "=0.59.5", default-features = false, features = ["http-transport-reqwest-rustls-no-provider", "executors-tokio", "layers-retry", "layers-timeout"], optional = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"
lipsum = "0.9"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["encrypted-keys", "opendal", "opendal-sftp"]
# OpenDAL storage path (L-809a): s3:// (incl. MinIO/RustFS, SSE-C), b2://, fs:// / file:// for
# --input/--output. `opendal-sftp` adds sftp:// (needs the OpenSSH `ssh` client at run time).
opendal = ["dep:opendal", "dep:opendal-http-transport-reqwest", "dep:futures", "dep:reqwest013", "opendal/services-s3", "opendal/services-b2", "opendal/services-fs"]
opendal-sftp = ["opendal", "opendal/services-sftp"]
# Decrypt encrypted PKCS#8 client keys (`--key` + `--pass`). Pulls in the RustCrypto
# aes/scrypt/pbkdf2/sha2 stack; `--no-default-features` builds leave it out (SUP-023).
encrypted-keys = ["dep:pkcs8"]
# Global allocator (L-802a, L-808b). At most one; none changes behaviour, only memory use and
# speed. Default: mimalloc on *-linux-gnu, the platform allocator elsewhere (musl included).
# `jemalloc` / `mimalloc` force that allocator on any target; `system-allocator` keeps the
# platform allocator (glibc malloc) on *-linux-gnu.
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
system-allocator = []
# Test tiers (TST-INF-001; .config/nextest.toml). None of these change the shipped binary.
# Podman-backed integration suite (tests/it, tests/integration_test.rs); see scripts/it/run.sh.
it = []
# Long-running tests against a live cluster (load tier; scripts/load/run.sh is the main load harness).
load = ["it"]
# Fault-injection tests (chaos tier).
chaos = []
# cargo-fuzz targets (fuzz/).
fuzz = []
# Deprecated upstream aliases, kept so old command lines still work.
large_scale_test = ["load"]
manual_test = ["load"]

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["it"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["it"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Lighter optimized profile for integration runs and CI: no LTO, parallel
# codegen. Keeps peak build memory low enough to run next to OpenSearch.
[profile.it]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
debug = false
incremental = true
