[package]
name = "elasticdump-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance Elasticsearch data dumper"
authors = ["TenYears <opensource@tenyears.tech>"]
license = "MIT"
repository = "https://github.com/tenyears-tech/elasticdump-rs"

[lib]
name = "elasticdump_rs"
path = "src/lib.rs"

[[bin]]
name = "elasticdump-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
] }
# Thin HTTP client: full control over endpoints (OpenSearch vs Elasticsearch
# PIT APIs), per-direction headers/params, gzip request bodies and TLS.
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "http2",
    "rustls-tls-manual-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
clap = { version = "4.4", features = ["derive", "wrap_help"] }
sonic-rs = "0.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1.0.102"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
bytes = "1.11.1"
url = "2.4"
base64 = "0.22"
http = "1.3"
bytesize = "2.0"
console = "0.15"
tokio-util = "0.7"
percent-encoding = "2"
flate2 = "1"
memchr = "2"
rust-ini = "0.21"
semver = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Legacy integration suite (tests/integration_test.rs) still drives its setup
# through the official client; the binary no longer depends on it.
elasticsearch = { version = "8.19.0-alpha.1", features = [
    "rustls-tls",
], default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"
lipsum = "0.9"
tempfile = "3"

[features]
large_scale_test = []
manual_test = []
# Podman-backed integration suite (tests/it); see scripts/it/run.sh.
it = []

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["it"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Lighter optimized profile for integration runs and CI: no LTO, parallel
# codegen. Keeps peak build memory low enough to run next to OpenSearch.
[profile.it]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
debug = false
incremental = true
