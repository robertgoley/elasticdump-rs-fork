# LOAD-004 matrix: compressed dumps. edverify reads .gz / .zst itself, so every
# cell is gated against the cluster digest.
name        = "matrix-compress"
description = "Dump: --fsCompress (gzip), --compressionType zstd levels 1/3/9"
engine      = "es717-plain"

[[seed]]
index   = "load-logs"
profile = "logs"
seed    = 1
docs    = "tier"

[[step]]
name     = "fscompress"
kind     = "dump"
compress = "fsCompress"
args     = ["--limit=2000"]

[[step]]
name     = "zstd-1"
kind     = "dump"
compress = "zstd"
level    = 1
args     = ["--limit=2000"]

[[step]]
name     = "zstd-3"
kind     = "dump"
compress = "zstd"
level    = 3
args     = ["--limit=2000"]

[[step]]
name     = "zstd-9"
kind     = "dump"
compress = "zstd"
level    = 9
args     = ["--limit=2000"]
