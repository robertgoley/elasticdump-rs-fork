# Test tiers (TST-INF-001). Every test belongs to exactly one tier:
#   unit      T0  lib/bin unit tests (all workspace crates)          no network
#   contract  T1  CLI contract, injection, secrets and tool tests    mock servers only
#   it        T2  live single-engine suites (tests/it; integration_test is plain-profile only)   needs scripts/it/up.sh
#   load      T3  long live-cluster tests (feature `load`)           needs a cluster
#   chaos     T5  fault-injection suites against in-process mocks (tests/chaos_brk.rs, phase A6)
# Run one tier with `cargo nextest run --profile <tier> [--features ...]`.
# Each profile writes JUnit XML to target/nextest/<tier>/junit.xml.
# `default` (no profile) = unit + contract + chaos. Correctness tests never auto-retry (INF-013).
#
# Flake policy (INF-013, scripts/sup/flake-policy.py runs in CI):
#  * `retries` stays 0 in every profile and override;
#  * a flaky test may be quarantined for at most 14 days with one line per test:
#      # quarantine: filter="test(=name)" owner="@someone" since="YYYY-MM-DD" reason="link or cause"
#    CI excludes it with `-E "$(scripts/sup/flake-policy.py --filter)"` and fails once it is older than 14 days;
#  * chaos tests print `CHAOS_SEED=<n>` (tests/support/chaos.rs) and replay with the same env var.
# Quarantine list (empty):

[profile.default]
default-filter = "kind(lib) | kind(bin) | binary(chaos_brk) | binary(cli_contract) | binary(injection) | binary(secrets) | binary(router_mock_selftest) | binary(golden_replay) | binary(fault_conformance) | (kind(test) & (package(edgen) | package(edverify)))"
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.unit]
default-filter = "kind(lib) | kind(bin)"
slow-timeout = { period = "30s", terminate-after = 1 }
[profile.unit.junit]
path = "junit.xml"
# Property suites run 10k-100k cases (L-501..L-510); give them 5 minutes instead of 30 s.
[[profile.unit.overrides]]
filter = "test(/::props::|::prop_bulk::|::url_props::|_props::/)"
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.contract]
default-filter = "binary(cli_contract) | binary(injection) | binary(secrets) | binary(router_mock_selftest) | binary(golden_replay) | binary(fault_conformance) | (kind(test) & (package(edgen) | package(edverify)))"
slow-timeout = { period = "60s", terminate-after = 3 }
[profile.contract.junit]
path = "junit.xml"

[profile.it]
default-filter = "(binary(it) | binary(integration_test)) & !test(/^test_large_scale_performance$|^test_create_data_for_manual_testing$/)"
# one engine on the box; suites manage their own concurrency (IT_THREADS)
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 5 }
[profile.it.junit]
path = "junit.xml"

[profile.load]
default-filter = "binary(integration_test) & test(/^test_large_scale_performance$|^test_create_data_for_manual_testing$/)"
test-threads = 1
slow-timeout = { period = "300s", terminate-after = 6 }
[profile.load.junit]
path = "junit.xml"

[profile.chaos]
default-filter = "binary(chaos_brk)"
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 5 }
[profile.chaos.junit]
path = "junit.xml"
