# Restore settings, mapping and one data object from s3://. Set DATA_INPUT to
# a split part if the dump was split. To load a whole searchdump-multi tree
# from the bucket, prefer a Job based on multi-index-restore.yaml with
# --input=s3://bucket/prefix --inputStorageConfig=... (it stages locally
# first; give the PVC enough room).
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-object-storage-restore
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.0.0-beta1-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              cfg="--inputStorageConfig=/run/searchdump/storage.ini"
              searchdump --input="${S3_URI}/${INDEX}.settings.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=settings ${cfg}
              searchdump --input="${S3_URI}/${INDEX}.mapping.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=mapping ${cfg}
              searchdump --input="${DATA_INPUT}" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=data \
                --limit="${LIMIT}" --concurrency="${CONCURRENCY}" ${cfg}
          env:
            - name: S3_URI
              value: "s3://backups/logs"
            - name: DATA_INPUT
              value: "s3://backups/logs/logs.data.json"
            - name: LIMIT
              value: 1000
            - name: CONCURRENCY
              value: 4
            - name: ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: DEST_ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: INDEX
              value: logs
            - name: DEST_INDEX
              value: logs
            - name: SEARCHDUMP_OUTPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_OUTPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: s3
              mountPath: /run/searchdump
              readOnly: true
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
        - name: s3
          secret:
            secretName: searchdump-s3
            items:
              - key: storage.ini
                path: storage.ini
