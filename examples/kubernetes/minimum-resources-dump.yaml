# Dump one index with small pages and one worker, so a constrained cluster
# (including a small-heap bitnamilegacy Elasticsearch node) stays under its
# memory guard. searchdump defaults to --limit=100 --concurrency=1; this Job
# also pins --workers=1 and --maxResponseMb=64.
#
# If you change this Job to searchdump-multi, do not keep its data-flag
# defaults: on current main every data child gets --limit=5000 and
# --maxResponseMb=0, which can 429 or OOM a small heap even with one thread
# and one shard. Pass -- --limit=500 --maxResponseMb=64 (see
# multi-index-dump.yaml and FEATURES-TODO.md item 1.1-10).
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-minimum-resources-dump
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.0.0-beta1-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              searchdump --input="${ES_URL}/${INDEX}" --output="/data/${INDEX}.settings.json" --type=settings --overwrite --limit=100 --workers=1 --concurrency=1 --maxResponseMb=64
              searchdump --input="${ES_URL}/${INDEX}" --output="/data/${INDEX}.mapping.json" --type=mapping --overwrite --limit=100 --workers=1 --concurrency=1 --maxResponseMb=64
              searchdump --input="${ES_URL}/${INDEX}" --output="/data/${INDEX}.data.json.gz" --type=data --overwrite --fsCompress --limit=100 --workers=1 --concurrency=1 --maxResponseMb=64
          env:
            - name: ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: DEST_ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: INDEX
              value: logs
            - name: DEST_INDEX
              value: logs
            - name: SEARCHDUMP_INPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_INPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
