# Fast restore: larger bulks, concurrent write batches, and --noRefresh so
# the cluster is not asked to refresh after every batch. --noRefresh is a
# main flag; do not invent --refreshInterval.
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-fastest-restore
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.0.0-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              searchdump --input="/data/${INDEX}.settings.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=settings
              searchdump --input="/data/${INDEX}.mapping.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=mapping
              searchdump --input="/data/${INDEX}.data.json.zst" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=data \
                --limit="${LIMIT}" --concurrency="${CONCURRENCY}" --workers="${WORKERS}" --bufferSize=32 --noRefresh --esCompress
          env:
            - name: LIMIT
              value: 2000
            - name: CONCURRENCY
              value: 8
            - name: WORKERS
              value: 8
            - name: ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: DEST_ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: INDEX
              value: logs
            - name: DEST_INDEX
              value: logs
            - name: SEARCHDUMP_OUTPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_OUTPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 4
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
