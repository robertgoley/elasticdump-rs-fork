# Restore over HTTPS with the same searchdump-tls and searchdump-es Secrets
# as the dump Job. DEST_ES_URL defaults to a TLS URL; point it at the
# destination cluster. If the destination user differs, change the
# secretKeyRef names for SEARCHDUMP_OUTPUT_*.
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-secure-tls-auth-restore
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.0.0-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              auth="--output-ca=/run/searchdump/ca.pem"
              if [ -s /run/searchdump/client.crt ]; then
                auth="${auth} --output-cert=/run/searchdump/client.crt --output-key=/run/searchdump/client.key"
              fi
              searchdump --input="/data/${INDEX}.settings.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=settings ${auth}
              searchdump --input="/data/${INDEX}.mapping.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=mapping ${auth}
              searchdump --input="/data/${INDEX}.data.json.gz" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=data --limit=500 --concurrency=2 ${auth}
          env:
            - name: ES_URL
              value: "https://elasticsearch.default.svc:9200"
            - name: DEST_ES_URL
              value: "https://elasticsearch.default.svc:9200"
            - name: INDEX
              value: logs
            - name: DEST_INDEX
              value: logs
            - name: SEARCHDUMP_OUTPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_OUTPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /run/searchdump
              readOnly: true
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: searchdump-tls
            items:
              - key: ca.pem
                path: ca.pem
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
