# Restore a split dump: one searchdump invocation per part, in order.
# searchdump-multi --direction=load (see multi-index-restore.yaml) finds the
# parts itself if you dumped with searchdump-multi.
apiVersion: batch/v1
kind: Job
metadata:
  name: searchdump-very-large-index-restore
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchdump
          image: ghcr.io/robertgoley/searchdump-rs:1.0.0-dhi-debian
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              searchdump --input="/data/${INDEX}.settings.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=settings
              searchdump --input="/data/${INDEX}.mapping.json" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=mapping
              found=0
              for f in /data/${INDEX}.data.split-*.json /data/${INDEX}.data.split-*.json.gz /data/${INDEX}.data.split-*.json.zst; do
                [ -f "$f" ] || continue
                found=1
                echo "restoring $f"
                searchdump --input="$f" --output="${DEST_ES_URL}/${DEST_INDEX}" --type=data \
                  --limit="${LIMIT}" --concurrency="${CONCURRENCY}" --workers=4
              done
              if [ "$found" -eq 0 ]; then
                echo "error: no split parts for ${INDEX} in /data" >&2
                exit 1
              fi
          env:
            - name: LIMIT
              value: 1000
            - name: CONCURRENCY
              value: 4
            - name: ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: DEST_ES_URL
              value: "http://elasticsearch.default.svc:9200"
            - name: INDEX
              value: logs
            - name: DEST_INDEX
              value: logs
            - name: SEARCHDUMP_OUTPUT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: username
            - name: SEARCHDUMP_OUTPUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searchdump-es
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dump
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dump
          persistentVolumeClaim:
            claimName: searchdump-dumps
        - name: tmp
          emptyDir: {}
