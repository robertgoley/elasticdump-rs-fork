# L-810e: grype ignore rules for the dhi-debian image (IMAGE_VARIANT=dhi-debian, the default image
# since L-810c), used by `make scan` instead of docker/grype-ignore.yaml for that variant only.
# Owner decision 2026-11-11: every High CVE in this image that Debian/DHI mark won't-fix is accepted
# with a SECURITY-CVE.md entry (section "dhi.io Debian 13 -dev (default since L-810c)"). Each rule
# matches one CVE id in one Debian package and only while grype reports the fix state as wont-fix:
# once a fix is published the state changes, no rule matches, and `make scan` fails again until
# the base pin is refreshed. Package names are regular expressions in grype, so each is anchored
# and escaped (libstdc\+\+6). Do not add rules without a SECURITY-CVE.md entry.
ignore:
  # CVE-2025-69720
  - vulnerability: CVE-2025-69720
    fix-state: wont-fix
    package:
      name: '^libtinfo6$'
      type: deb
