# L-810e: trivy ignore rules for the dhi-debian image only (`make scan` passes this file with
# --ignorefile when IMAGE_VARIANT=dhi-debian). Same accepted CVEs as docker/grype-ignore.dhi-debian.yaml,
# each documented in SECURITY-CVE.md. Each entry is scoped to the named Debian packages (purls
# without a version, so a rebuilt base with the same unfixed packages still matches). trivy has no
# fix-state filter: when a fix is published the CVE is still ignored here, but grype (which does
# filter on wont-fix) fails `make scan`, which is the revisit trigger for both files.
vulnerabilities:
  - id: CVE-2025-69720
    purls:
      - pkg:deb/debian/libtinfo6
      - pkg:deb/debian/ncurses-base
      - pkg:deb/debian/ncurses-bin
      - pkg:deb/debian/ncurses-term
    statement: "won't-fix upstream; not reachable from searchdump, see SECURITY-CVE.md (L-810e)"
