[package]
name = "elasticdump-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
elasticdump-rs = { path = "..", default-features = false, features = ["fuzz"] }

# Not part of the main workspace (nightly + sanitizer builds only).
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "json_split"
path = "fuzz_targets/json_split.rs"
test = false
doc = false
bench = false

