# Dataset manifest (TST-DATA-004, TEST-REQUIREMENTS §5.1).
# Fetch with scripts/data/fetch.sh, convert with scripts/data/convert.sh.
#
# sha256/size were measured on 2026-10-29 by streaming each file once.
# Entries with sha256 = "" are NOT pinned yet: fetch.sh refuses them unless
# --allow-unpinned is given, and then prints the hash to pin (trust on first
# use; B pins them in B1).
#
# license_class:
#   ok          licence allows use in CI artefacts;
#   ask         usable locally, CI use needs the owner's OK (Q9);
#   blocked     non-commercial / research-only / needs a login: never in CI.

[policy]
ci_license_classes = ["ok"]

