# Static musl builds. Manual trigger only; artifacts are attached to the run.
# Nothing is published (no GitHub release, no crates.io) without Robert's approval.
name: release-build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musl:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1, targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: "${{ matrix.target }}" }
      # zig provides the C cross-compiler for zstd-sys / ring.
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        with: { version: 0.13.0 }
      # pinned: 0.21.8 is the newest release whose MSRV (1.85) matches the toolchain
      - run: cargo install cargo-zigbuild --locked --version 0.21.8
      - run: cargo zigbuild --release --target "$TARGET"
        env: { TARGET: "${{ matrix.target }}" }
      - env: { TARGET: "${{ matrix.target }}" }
        run: |
          f="target/$TARGET/release/elasticdump-rs"
          file "$f"
          tar czf "elasticdump-rs-$TARGET.tar.gz" -C "$(dirname "$f")" elasticdump-rs
          sha256sum "elasticdump-rs-$TARGET.tar.gz" > "elasticdump-rs-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elasticdump-rs-${{ matrix.target }}
          path: elasticdump-rs-${{ matrix.target }}.tar.gz*

  # L-705 / TST-SUP-016: behaviour diff of this release candidate against the previous release's
  # profile (results/profiles/): SUP-002 trace + SUP-001 egress runs, condensed and diffed; any
  # new syscall class, path, socket, connect target, exec or DNS name without a line in
  # scripts/sup/rc-signoff.txt fails the job. The profile and diff are uploaded as `rc-diff`.
  behaviour-diff:
    name: RC behaviour diff (SUP-016)
    runs-on: ubuntu-24.04
    # T2 builds the image from dhi.io bases; pull-only secrets as in the nightly egress job
    environment: dhi-pull
    env:
      IT_DIR: /tmp/edrs-it
      RC_DIFF_DIR: /tmp/edrs-it/rc-diff
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.85.1 --profile minimal && rustup default 1.85.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked --version 0.9.150 cargo-nextest
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends strace
      - name: Log in to dhi.io (pull only)
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are not set; dhi.io pulls need them"
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | podman login dhi.io -u "$DHI_USERNAME" --password-stdin
      - run: make image CONTAINER=podman
      - run: python3 scripts/sup/rc-profile.py --selftest
      - run: scripts/sup/rc-diff.sh
      - if: always()
        run: cat /tmp/edrs-it/rc-diff/diff.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: rc-diff, path: /tmp/edrs-it/rc-diff/ }
