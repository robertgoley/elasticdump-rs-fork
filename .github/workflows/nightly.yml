name: nightly
# INF-010 nightly layout: full T2 (16 profiles), T3 cross, T5 load (L1R on hosted runners),
# T7 chaos. A failure opens no ticket (owner's call); it leaves artefacts: tool logs,
# podman logs, metrics JSON, digests and golden diffs (scripts/ci/collect-artifacts.sh).
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  it-full:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: opensearch-plain, os_tag: "2" }
          - { profile: opensearch-secure, os_tag: "2" }
          - { profile: opensearch-plain, os_tag: "3" }
          - { profile: opensearch-secure, os_tag: "3" }
          - { profile: elasticsearch-plain }     # latest bitnamilegacy (9.1.2)
          - { profile: elasticsearch-secure }
          - { profile: elasticsearch8-plain }    # pinned regression tag 8.6.1
          - { profile: elasticsearch8-secure }
          - { profile: es717-plain }             # official 7.17.29
          - { profile: es717-secure }
          - { profile: es710-plain }             # bitnamilegacy 7.10.2 (OSS build)
          - { profile: es710-secure }            # official 7.10.2 (default distribution)
          - { profile: es819-plain }             # official 8.19.23
          - { profile: es819-secure }
          - { profile: os13-plain }              # opensearchproject/opensearch:1.3.20
          - { profile: os13-secure }
    env:
      OS_TAG: ${{ matrix.os_tag || '2' }}
      IT_DIR: /tmp/edrs-it
      ARTIFACT: it-${{ matrix.profile }}-${{ matrix.os_tag || 'x' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/it/run.sh "$PROFILE"
        env: { PROFILE: "${{ matrix.profile }}" }
      # API-004 drift job: re-record the goldens live and require a normalised zero diff
      # (target/golden-diff/<engine>-<version>.diff is the drift report artefact)
      - if: endsWith(matrix.profile, '-plain')
        run: scripts/golden/record.sh "$PROFILE" --check
        env: { PROFILE: "${{ matrix.profile }}" }
      - if: always()
        run: scripts/ci/collect-artifacts.sh "$ARTIFACT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "${{ env.ARTIFACT }}", path: artifacts/ }

  chaos:
    runs-on: ubuntu-24.04
    env:
      IT_DIR: /tmp/edrs-it
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked --version 0.9.150 cargo-nextest
      # T7: every chaos test prints CHAOS_SEED=<n>; replay with the same env var (INF-013).
      - run: cargo nextest run --profile chaos --features chaos --no-tests=pass
      # INF-004: the fault conformance suite against both proxies (in-process + toxiproxy container).
      - run: |
          eval "$(scripts/it/toxiproxy.sh up)"
          cargo nextest run --profile contract -E 'binary(fault_conformance)'
      - if: always()
        run: scripts/it/toxiproxy.sh down
      - if: always()
        run: scripts/ci/collect-artifacts.sh chaos
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: chaos, path: artifacts/ }

  load-nightly:
    runs-on: ubuntu-24.04
    env:
      IT_DIR: /tmp/edrs-it
      LOAD_PLACE: runner
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # T5 on a hosted runner = L1R (5M docs, zstd only); full L1 runs on the soak host.
      - run: scripts/load/run.sh L1R dump-restore-logs --engine opensearch-plain --place runner
      - if: always()
        run: scripts/ci/collect-artifacts.sh load-nightly
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-nightly
          path: |
            artifacts/
            results/load/

  # ES <-> OpenSearch: sequential file legs, then cluster to cluster with both
  # nodes up (runners have ~16 GB, so the two-node leg must not skip here).
  cross:
    # T3
    runs-on: ubuntu-24.04
    env:
      IT_DIR: /tmp/edrs-it
      CROSS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: podman --version
      - name: file dump/restore, both directions (one container at a time)
        run: |
          scripts/it/run.sh opensearch-plain cross::file
          scripts/it/run.sh elasticsearch-plain cross::file
          scripts/it/run.sh elasticsearch8-plain cross::file
          scripts/it/run.sh es717-plain cross::file
          scripts/it/run.sh es710-plain cross::file
          scripts/it/run.sh es819-plain cross::file
          IT_LEGACY=0 scripts/it/run.sh opensearch-plain cross::file_dump_from
          IT_LEGACY=0 scripts/it/run.sh os13-plain cross::file_dump_from
      - run: scripts/it/run.sh cross
      - if: always()
        run: scripts/ci/collect-artifacts.sh cross
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: cross, path: artifacts/ }

  # L-701 / TST-SUP-001: T1 + T7 + T2 (opensearch-plain) and the built image, all inside a
  # `podman pod --network none` namespace with a logging DNS sink and OutNoRoutes counters;
  # any connection attempt or DNS query beyond loopback / reserved names fails the job.
  # --selftest first proves a planted example.com lookup and a planted connect are caught.
  egress:
    name: egress-denied runs (SUP-001)
    runs-on: ubuntu-24.04
    # pull-only DHI secrets are read through a dedicated environment (zizmor secrets-outside-env);
    # repository-level secrets stay visible to it, so the job works before they are moved there
    environment: dhi-pull
    env:
      IT_DIR: /tmp/edrs-it
      EGRESS_LOG_DIR: /tmp/edrs-it/egress
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.85.1 --profile minimal && rustup default 1.85.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked --version 0.9.150 cargo-nextest
      - run: cargo fetch --locked
      # Same pull-only login as security.yml (secrets DHI_USERNAME / DHI_TOKEN; no values here).
      - name: Log in to dhi.io (pull only)
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are not set; dhi.io pulls need them"
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | podman login dhi.io -u "$DHI_USERNAME" --password-stdin
      - run: make image CONTAINER=podman
      - run: scripts/sup/egress.sh --selftest
      - run: scripts/sup/egress.sh --tiers T1,T7,T2 --profile opensearch-plain
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: egress, path: /tmp/edrs-it/egress/ }

  # L-702 / TST-SUP-002: strace (%file,%network,%process) around a dump/restore/split/meta/TLS
  # command matrix; any syscall entry outside scripts/sup/trace-allow.txt fails the job.
  # --selftest first proves a planted execve, a planted connect and a missing rule are caught.
  trace:
    name: syscall tracing (SUP-002)
    runs-on: ubuntu-24.04
    env:
      IT_DIR: /tmp/edrs-it
      TRACE_LOG_DIR: /tmp/edrs-it/trace
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.85.1 --profile minimal && rustup default 1.85.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends strace
      - run: TRACE_LOG_DIR=/tmp/edrs-it/trace-selftest scripts/sup/trace.sh --selftest
      - run: scripts/sup/trace.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: trace, path: "/tmp/edrs-it/trace*/" }
