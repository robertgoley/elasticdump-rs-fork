name: ci
on:
  pull_request:
  push:
    branches: [main, rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --lib --bins --tests --features it -- -D warnings
      - run: cargo test --lib --bins
      - run: cargo test --test cli_contract

  # SUP-* supply-chain gates (TEST-REQUIREMENTS §7.3, TASKS-LOCAL A2).
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked --version 0.10.3 cargo-vet
      # L-201 / SUP-004: every crate audited (imported audits) or exempted.
      - run: cargo vet --locked
      # L-203 / SUP-006: unsafe inventory; a rise against the baseline fails.
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # nightly (cargo-geiger 0.14 needs >= 1.97)
        with: { toolchain: nightly }
      - run: cargo +nightly install --locked --version 0.14.0 cargo-geiger --features vendored-openssl
      - run: scripts/sup/geiger-gate.sh

  it:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: opensearch-plain, os_tag: "2" }
          - { profile: opensearch-secure, os_tag: "2" }
          - { profile: opensearch-plain, os_tag: "3" }
          - { profile: opensearch-secure, os_tag: "3" }
          - { profile: elasticsearch-plain }     # latest bitnamilegacy (9.1.2)
          - { profile: elasticsearch-secure }
          - { profile: elasticsearch8-plain }    # pinned regression tag 8.6.1
          - { profile: elasticsearch8-secure }
          # regression matrix (exact images in scripts/it/run.sh, TESTING-MATRIX.md)
          - { profile: es717-plain }             # official 7.17.29
          - { profile: es717-secure }
          - { profile: es710-plain }             # bitnamilegacy 7.10.2 (OSS build)
          - { profile: es710-secure }            # official 7.10.2 (default distribution)
          - { profile: es819-plain }             # official 8.19.23
          - { profile: es819-secure }
          - { profile: os13-plain }              # opensearchproject/opensearch:1.3.20
          - { profile: os13-secure }
    env:
      OS_TAG: ${{ matrix.os_tag || '2' }}
      IT_DIR: /tmp/edrs-it
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: podman --version
      - run: scripts/it/run.sh "$PROFILE"
        env: { PROFILE: "${{ matrix.profile }}" }
      - if: failure()
        run: podman ps -a; for c in $(podman ps -aq); do podman logs --tail 200 $c; done

  # ES <-> OpenSearch: sequential file legs, then cluster to cluster with both
  # nodes up (runners have ~16 GB, so the two-node leg must not skip here).
  cross:
    runs-on: ubuntu-24.04
    env:
      IT_DIR: /tmp/edrs-it
      CROSS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: podman --version
      - name: file dump/restore, both directions (one container at a time)
        run: |
          scripts/it/run.sh opensearch-plain cross::file
          scripts/it/run.sh elasticsearch-plain cross::file
          scripts/it/run.sh elasticsearch8-plain cross::file
          scripts/it/run.sh es717-plain cross::file
          scripts/it/run.sh es710-plain cross::file
          scripts/it/run.sh es819-plain cross::file
          IT_LEGACY=0 scripts/it/run.sh opensearch-plain cross::file_dump_from
          IT_LEGACY=0 scripts/it/run.sh os13-plain cross::file_dump_from
      - run: scripts/it/run.sh cross
      - if: failure()
        run: podman ps -a; for c in $(podman ps -aq); do podman logs --tail 200 $c; done
