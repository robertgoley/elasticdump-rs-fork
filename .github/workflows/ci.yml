name: ci
on:
  pull_request:
  push:
    branches: [main, rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --lib --bins --tests --features elasticdump-rs/load -- -D warnings
      # L-301 / INF-001: tiers from .config/nextest.toml (T0 unit, T1 contract); JUnit in target/nextest/<tier>/
      - run: cargo install --locked --version 0.9.150 cargo-nextest
      # L-313 / INF-013: no auto-retry; quarantines need owner + date and expire after 14 days.
      - run: scripts/sup/flake-policy.py
      - run: cargo nextest run --workspace --profile unit -E "$(scripts/sup/flake-policy.py --filter)"
      - run: cargo nextest run --workspace --profile contract -E "$(scripts/sup/flake-policy.py --filter)"

  # SUP-* supply-chain gates (TEST-REQUIREMENTS §7.3, TASKS-LOCAL A2).
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked --version 0.10.3 cargo-vet
      # L-201 / SUP-004: every crate audited (imported audits) or exempted.
      - run: cargo vet --locked
      # L-204 / SUP-007: no unused dependencies (rust-ini ignored: imported as `ini`).
      - run: cargo install --locked --version 0.9.2 cargo-machete
      - run: cargo machete
      # L-213 / SUP-021: native code only from the allow-list (ring, zstd-sys).
      - run: scripts/sup/native-code-check.py
      # L-312 / INF-012: every IT/tool image pinned by digest and recorded in TESTING-MATRIX.md.
      - run: scripts/it/check-pins.sh
      # L-311 / INF-011: generated TESTING-MATRIX.md blocks (digests, goldens, expectation table) are current.
      - run: scripts/it/matrix-md.py --check
      # L-203 / SUP-006: unsafe inventory; a rise against the baseline fails.
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # nightly (cargo-geiger 0.14 needs >= 1.97)
        with: { toolchain: nightly }
      - run: cargo +nightly install --locked --version 0.14.0 cargo-geiger --features vendored-openssl
      - run: scripts/sup/geiger-gate.sh

  # T2 subset on every PR (INF-010): OS 2.19 plain+secure, ES 9.1 plain, ES 7.10 OSS.
  # The full 16-profile matrix and the cross legs run nightly (nightly.yml).
  it:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: opensearch-plain, os_tag: "2" }
          - { profile: opensearch-secure, os_tag: "2" }
          - { profile: elasticsearch-plain }     # latest bitnamilegacy (9.1.2)
          - { profile: es710-plain }             # bitnamilegacy 7.10.2 (OSS build)
    env:
      OS_TAG: ${{ matrix.os_tag || '2' }}
      IT_DIR: /tmp/edrs-it
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: podman --version
      - run: scripts/it/run.sh "$PROFILE"
        env: { PROFILE: "${{ matrix.profile }}" }
      - if: failure()
        run: scripts/ci/collect-artifacts.sh "it-$PROFILE"
        env: { PROFILE: "${{ matrix.profile }}" }
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "it-${{ matrix.profile }}-failure", path: artifacts/ }

  # T4 load smoke (L0, 100k docs + edge set, digest-verified) on PRs that touch the tool.
  load-smoke:
    runs-on: ubuntu-24.04
    env:
      IT_DIR: /tmp/edrs-it
      LOAD_PLACE: runner
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: touched
        name: does this change touch the tool?
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]] || \
             ! git diff --quiet "$BASE" HEAD -- src Cargo.toml Cargo.lock scripts/load; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.touched.outputs.run == '1'
        uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - if: steps.touched.outputs.run == '1'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.touched.outputs.run == '1'
        run: scripts/load/run.sh L0 dump-restore-logs --engine opensearch-plain --place runner
      - if: failure()
        run: scripts/ci/collect-artifacts.sh load-smoke
      - if: always() && steps.touched.outputs.run == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-smoke
          path: |
            artifacts/
            results/load/
