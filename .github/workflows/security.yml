name: security
# Dependency advisories, licence/source policy, image CVE scan and SBOMs.
# Nothing is published: no registry login for pushing, no `push`, only
# workflow artifacts (SBOMs and scan reports).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, rewrite]
  workflow_dispatch:
    inputs:
      base:
        description: "Image bases: dhi (default; dhi.io static glibc + mimalloc), dhi-alpine, dhi-debian, alpine (public), debian (public)"
        type: choice
        options: [dhi, dhi-alpine, dhi-debian, alpine, debian]
        default: dhi
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches advisories published after the last push

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with: { tool: "cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9" }
      # any vulnerability, or an unmaintained/unsound/yanked warning, fails the job
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories bans licenses sources
      # L-808f: THIRD-PARTY-NOTICES.md (generated block) must match Cargo.lock / the cargo-deny crate graph
      - run: scripts/third-party-notices.py --check
      - run: cargo cyclonedx --format json --override-filename sbom-cargo.cdx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom-cargo, path: "sbom-cargo.cdx.json" }

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      # F-01: pinned scanner releases, SHA-256 checked (no `curl | sh`).
      - name: Install scanners (pinned, checksum-verified)
        env:
          GRYPE_URL: https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
          SYFT_URL: https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          TRIVY_URL: https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          fetch() {
            curl -fsSL -o "/tmp/$1.tgz" "$2"
            echo "$3  /tmp/$1.tgz" | sha256sum -c -
            sudo tar -C /usr/local/bin -xzf "/tmp/$1.tgz" "$1"
          }
          fetch grype "$GRYPE_URL" "$GRYPE_SHA256"
          fetch syft "$SYFT_URL" "$SYFT_SHA256"
          fetch trivy "$TRIVY_URL" "$TRIVY_SHA256"
      # The default target is the dhi.io image (`make image`). Docker Hardened
      # Images need a pull login: add repository secrets DHI_USERNAME (Docker
      # ID) and DHI_TOKEN (a read-only/pull access token). No values live in
      # this repo; the login is pull-only and never reaches an image layer.
      # Without the secrets, run manually with base=alpine (public bases).
      - name: Log in to dhi.io (pull only)
        if: startsWith(inputs.base || 'dhi', 'dhi')
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are not set; dhi.io pulls need them (or dispatch with base=alpine)"
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | podman login dhi.io -u "$DHI_USERNAME" --password-stdin
      # F-09: the dispatch input reaches the shell only through env and an
      # allow-list.
      - name: Build image (local only)
        env:
          BASE: ${{ inputs.base || 'dhi' }}
        run: |
          case "$BASE" in
            dhi) make image CONTAINER=podman ;;
            dhi-alpine) make image-dhi-alpine CONTAINER=podman ;;
            dhi-debian) make image-dhi-debian CONTAINER=podman ;;
            debian) make image-public CONTAINER=podman ;;
            alpine) make image-alpine CONTAINER=podman ;;
            *) echo "::error::unknown base '$BASE' (allowed: dhi, dhi-alpine, dhi-debian, alpine, debian)"; exit 1 ;;
          esac
      # L-211 / SUP-017: non-root, --read-only + /data, executable set, base digest.
      # IMAGE_VARIANT also picks the tag that sbom/scan read (Makefile SUFFIX_*).
      - name: Image hardening tests
        env:
          BASE: ${{ inputs.base || 'dhi' }}
        run: |
          case "$BASE" in
            dhi) v=dhi-static ;; dhi-alpine) v=dhi-alpine ;; dhi-debian) v=dhi-debian ;; debian) v=public ;; alpine) v=alpine ;;
            *) echo "::error::unknown base '$BASE'"; exit 1 ;;
          esac
          echo "IMAGE_VARIANT=$v" >> "$GITHUB_ENV"
          make test-image CONTAINER=podman IMAGE_VARIANT="$v"
      - name: SBOM (CycloneDX + SPDX)
        run: make sbom CONTAINER=podman IMAGE_VARIANT="$IMAGE_VARIANT"
      - name: grype + trivy (fail on HIGH/CRITICAL)
        run: make scan CONTAINER=podman IMAGE_VARIANT="$IMAGE_VARIANT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom-image, path: "sbom-image.*.json" }
      - if: always()
        run: podman logout dhi.io || true

  # L-204 / SUP-007: cargo-udeps (nightly, compiles every target incl. the it/load test features).
  unused-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # nightly
        with: { toolchain: nightly }
      - run: cargo +nightly install --locked --version 0.1.61 cargo-udeps
      - run: cargo +nightly udeps --workspace --all-targets --features elasticdump-rs/load

  # L-212 / SUP-019: weekly crate publisher/ownership diff against supply-chain/publishers.json.
  # Exit 10 (job fails) when an existing crate gains or loses an owner; the report is an artefact.
  publishers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - run: cargo install --locked --version 0.3.8 cargo-supply-chain
      # no `update`: without the db-dump cache it queries the crates.io API (~2 s/crate, ~8 min)
      - run: cargo supply-chain json > sc.json
      - run: scripts/sup/publishers.py diff supply-chain/publishers.json sc.json --markdown | tee publishers-report.md >> "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publishers-report
          path: |
            publishers-report.md
            sc.json

  # L-205 / SUP-008: coverage (T0+T1 here; T2 via scripts/sup/coverage.sh locally) and the
  # never-executed function list reviewed into docs/UNCOVERED-FUNCTIONS.md each release.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # nightly (installs the tools)
        with: { toolchain: nightly }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1, components: llvm-tools-preview }
      - run: cargo +nightly install --locked --version 0.9.1 cargo-llvm-cov
      - run: cargo +nightly install --locked --version 0.9.150 cargo-nextest
      - run: cargo +nightly install --locked --version 0.2.1 rustfilt
      - run: cargo llvm-cov --no-report nextest -p elasticdump-rs --features load --profile unit
      - run: cargo llvm-cov --no-report nextest -p elasticdump-rs --features load --profile contract
      - run: cargo llvm-cov report -p elasticdump-rs --json --output-path cov.json
      - run: scripts/sup/uncovered.py cov.json --root "$PWD" >> "$GITHUB_STEP_SUMMARY"

  # L-206 / SUP-009: build-time code inventory gate + release build with --network none.
  offline-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - run: scripts/sup/build-inventory.py
      - run: scripts/sup/offline-build.sh

  # L-207 / SUP-011: SBOM + build-time inventory diff against the PR base; a non-empty diff
  # needs the `sbom-reviewed` label. The diff is attached as an artefact and job summary.
  sbom-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with: { tool: "cargo-cyclonedx@0.5.9" }
      - name: SBOM diff and label gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'sbom-reviewed') }}
        run: |
          rc=0; scripts/sup/sbom-pr.sh "$BASE_SHA" sbom-diff || rc=$?
          cat sbom-diff/diff.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 10 ] && [ "$REVIEWED" != true ]; then
            echo "::error::SBOM/build-time code changed: review, then add the sbom-reviewed label"; exit 1
          fi
          [ "$rc" = 0 ] || [ "$rc" = 10 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: sbom-diff, path: sbom-diff/ }

  # L-210 / SUP-015: gitleaks (history, or the PR's commits) + tracked tree + secrets canary suite.
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85.1
        with: { toolchain: 1.85.1 }
      - name: install gitleaks 8.28.0 (checksum-verified)
        run: |
          V=8.28.0; cd "$RUNNER_TEMP"
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o gl.sums "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep linux_x64.tar.gz gl.sums | sed 's#  .*#  gl.tgz#' | sha256sum -c
          tar -xzf gl.tgz gitleaks && install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: scan
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: scripts/sup/secret-scan.sh $RANGE
