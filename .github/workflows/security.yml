name: security
# Dependency advisories, licence/source policy, image CVE scan and SBOMs.
# Nothing is published: no registry login for pushing, no `push`, only
# workflow artifacts (SBOMs and scan reports).
on:
  push:
    branches: [main, rewrite]
  workflow_dispatch:
    inputs:
      base:
        description: "Image bases: dhi (default; dhi.io Alpine), dhi-debian, alpine (public), debian (public)"
        default: dhi
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches advisories published after the last push

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-audit,cargo-deny,cargo-cyclonedx" }
      # any vulnerability, or an unmaintained/unsound/yanked warning, fails the job
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories bans licenses sources
      - run: cargo cyclonedx --format json --override-filename sbom-cargo.cdx
      - uses: actions/upload-artifact@v4
        with: { name: sbom-cargo, path: "sbom-cargo.cdx.json" }

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      # The default target is the dhi.io image (`make image`). Docker Hardened
      # Images need a pull login: add repository secrets DHI_USERNAME (Docker
      # ID) and DHI_TOKEN (a read-only/pull access token). No values live in
      # this repo; the login is pull-only and never reaches an image layer.
      # Without the secrets, run manually with base=alpine (public bases).
      - name: Log in to dhi.io (pull only)
        if: startsWith(github.event.inputs.base || 'dhi', 'dhi')
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are not set; dhi.io pulls need them (or dispatch with base=alpine)"
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | podman login dhi.io -u "$DHI_USERNAME" --password-stdin
      - name: Build image (local only)
        run: |
          case "${{ github.event.inputs.base || 'dhi' }}" in
            dhi) make image CONTAINER=podman ;;
            dhi-debian) make image-dhi-debian CONTAINER=podman ;;
            debian) make image-public CONTAINER=podman ;;
            *) make image-alpine CONTAINER=podman ;;
          esac
      - run: make test-image CONTAINER=podman
      - name: SBOM (CycloneDX + SPDX)
        run: make sbom CONTAINER=podman
      - name: grype + trivy (fail on HIGH/CRITICAL)
        run: make scan CONTAINER=podman
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: sbom-image, path: "sbom-image.*.json" }
      - if: always()
        run: podman logout dhi.io || true
