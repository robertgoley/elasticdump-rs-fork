# cargo-deny configuration: `cargo deny check advisories bans licenses sources`
# (CI job `security` in .github/workflows/ci.yml; see SECURITY-CVE.md).

[graph]
all-features = true
# Shipped targets only (Linux). Windows/wasm-only crates are out of scope.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]

[advisories]
# RustSec advisory DB; any vulnerability fails. Unmaintained / unsound crates
# fail too unless listed below with a justification.
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # L-809a (opendal 0.57, the last release that builds with our rust-version 1.85): owner
    # decision pending, see FEATURES-TODO "OpenDAL" row. Both are fixed by raising
    # rust-version to 1.91 and moving to opendal >= 0.58 (quick-xml 0.41) / ctutils >= 0.4.4
    # (needs 1.87).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 in opendal-core 0.57: quadratic duplicate-attribute check; only parses XML replies of the S3 endpoint the user configured (DoS by a hostile endpoint only); fixed in 0.41 (opendal >= 0.58 needs Rust 1.91)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 in opendal-core 0.57: NsReader namespace allocation; same exposure as RUSTSEC-2026-0194 (configured S3 endpoint only)" },
    { id = "RUSTSEC-2026-0385", reason = "ctutils 0.4.2 (digest 0.11 -> hmac 0.13 in reqsign, SigV4 signing): non-constant-time masks while signing locally; no remote timing oracle on the signing key; fix 0.4.4 needs Rust 1.87" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
    # tiny-keccak (rust-ini -> ordered-multimap -> dlv-list -> const-random)
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
# SUP-005: one version per crate unless skipped below with a reason.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    # hyper-util uses base64 0.23; reqwest and our code use 0.22.
    { crate = "base64@0.22.1", reason = "reqwest 0.12 / our code; hyper-util moved to 0.23" },
    # rust-ini -> ordered-multimap pins hashbrown 0.14.
    { crate = "hashbrown@0.14.5", reason = "rust-ini -> ordered-multimap 0.7" },
    # const-random-macro (via rust-ini -> dlv-list) still on getrandom 0.2.
    { crate = "getrandom@0.2.17", reason = "rust-ini -> dlv-list -> const-random" },
    # L-809a: opendal 0.57 (the OpenDAL storage path) brings its own HTTP client and the
    # RustCrypto 0.11 generation (reqsign for S3 SigV4); our side stays on reqwest 0.12 and
    # the 0.10 RustCrypto stack of pkcs8 (encrypted --key). Pure Rust, rustls/ring only.
    { crate = "reqwest@0.13.5", reason = "opendal-core 0.57 HTTP client (L-809a); ours is 0.12" },
    { crate = "quick-xml@0.39.4", reason = "opendal-core 0.57; reqsign-aws-core uses 0.41" },
    { crate = "sha2@0.11.0", reason = "reqsign (opendal S3 SigV4); pkcs5 uses 0.10" },
    { crate = "hmac@0.13.0", reason = "reqsign (opendal S3 SigV4); pbkdf2 uses 0.12" },
    { crate = "digest@0.11.3", reason = "reqsign (opendal S3 SigV4); RustCrypto 0.10 stack uses 0.10" },
    { crate = "crypto-common@0.2.2", reason = "RustCrypto 0.11 stack via reqsign (L-809a)" },
    { crate = "block-buffer@0.12.1", reason = "RustCrypto 0.11 stack via reqsign (L-809a)" },
    { crate = "const-oid@0.10.3", reason = "RustCrypto 0.11 stack via reqsign (L-809a)" },
    { crate = "cpufeatures@0.3.1", reason = "RustCrypto 0.11 stack via reqsign (L-809a); aes uses 0.2" },
    { crate = "getrandom@0.4.3", reason = "tempfile via openssh (opendal sftp, L-809a); ahash uses 0.3" },
    { crate = "syn@2.0.119", reason = "derive_destructure2 (openssh-sftp-client, L-809a); clap_derive uses syn 3" },
]
# Crates we never want in the graph: OpenSSL / native TLS, libgit2, other HTTP
# clients (reqwest/hyper is the only one), libcurl.
deny = [
    { crate = "openssl", reason = "TLS is rustls only" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    { crate = "native-tls", reason = "TLS is rustls only" },
    { crate = "hyper-tls", reason = "TLS is rustls only" },
    { crate = "git2", reason = "no libgit2" },
    { crate = "libgit2-sys", reason = "no libgit2" },
    { crate = "curl", reason = "HTTP client is reqwest/hyper" },
    { crate = "curl-sys", reason = "HTTP client is reqwest/hyper" },
    { crate = "isahc", reason = "HTTP client is reqwest/hyper" },
    { crate = "ureq", reason = "HTTP client is reqwest/hyper" },
    { crate = "surf", reason = "HTTP client is reqwest/hyper" },
    { crate = "attohttpc", reason = "HTTP client is reqwest/hyper" },
    { crate = "libz-sys", reason = "zlib is the pure-Rust zlib-rs backend (SUP-021)" },
]

# SUP-005 / SUP-009 / SUP-021: build scripts run arbitrary code at build time.
# Only the crates below may have one; a new build-script crate fails until it
# is reviewed and added here (docs/SUPPLY-CHAIN.md, "Build scripts").
[bans.build]
executables = "deny"
include-dependencies = true
include-archives = true
interpreted = "deny"
allow-build-scripts = [
    { crate = "ahash" }, # cfg probe (rustc version / target features)
    { crate = "anyhow" }, # rustc feature probe (backtrace)
    { crate = "crc32c" }, # rustc version probe + CRC tables into OUT_DIR (opendal S3, L-809a)
    { crate = "crc32fast" }, # cfg probe
    { crate = "crunchy" }, # generates unrolling macros (OUT_DIR only)
    { crate = "generic-array" }, # rustc version probe
    { crate = "getrandom" }, # cfg probe
    { crate = "httparse" }, # SIMD cfg probe
    { crate = "icu_normalizer_data" }, # cfg probe for baked data
    { crate = "icu_properties_data" }, # cfg probe for baked data
    { crate = "libc" }, # rustc version / target cfg probe
    { crate = "libmimalloc-sys" }, # NATIVE: compiles bundled mimalloc C via cc; optional feature `mimalloc` only (L-802a)
    { crate = "num-traits" }, # autocfg rustc probe only (dev-only, via proptest; L-501)
    { crate = "parking_lot_core" }, # cfg probe
    { crate = "portable-atomic" }, # target-feature cfg probe
    { crate = "proc-macro2" }, # rustc version probe
    { crate = "quote" }, # rustc version probe
    { crate = "ref-cast" }, # rustc version probe
    { crate = "ring" }, # NATIVE: compiles C/asm via cc (SUP-021 allow-list)
    { crate = "rustix" }, # cfg probe (linux_raw backend)
    { crate = "rustls" }, # cfg probe
    { crate = "rustversion" }, # runs `$RUSTC --version` (proc-macro via arc-swap; opendal sftp, L-809a)
    { crate = "serde" }, # rustc version probe
    { crate = "serde_core" }, # rustc version probe
    { crate = "serde_json" }, # cfg probe
    { crate = "thiserror" }, # rustc nightly-feature probe
    { crate = "tikv-jemalloc-sys" }, # NATIVE: runs jemalloc's configure + make (sh); optional feature `jemalloc` only (L-802a)
    { crate = "tiny-keccak" }, # cfg probe
    { crate = "zerocopy" }, # rustc version probe
    { crate = "zmij" }, # cfg probe
    { crate = "zstd-safe" }, # cfg probe
    { crate = "zstd-sys" }, # NATIVE: compiles bundled zstd C via cc (SUP-021 allow-list)
]
# Scripts shipped in the package that the build never runs (reviewed at these
# exact versions; a version bump needs a fresh look):
#  - untrusted: maintainer shell scripts under mk/;
#  - ring: perlasm generators; the crates.io package carries pregenerated
#    assembly and build.rs only runs perl when building from a git checkout;
#  - zerocopy: maintainer CI scripts;
#  - tikv-jemalloc-sys (optional feature `jemalloc` only, L-802a): unlike the
#    others, its build.rs DOES run jemalloc's autoconf `configure` script and
#    `make` (with sh); the namespace/mangle .sh helpers run during that build and
#    the rest are upstream maintainer scripts. The default build never compiles
#    this crate.
bypass = [
    { crate = "untrusted@0.9.0", allow-globs = ["mk/*"] },
    { crate = "ring@0.17.14", allow-globs = ["crypto/**/*.pl"] },
    { crate = "zerocopy@0.8.63", allow-globs = ["cargo.sh", "ci/*.sh"] },
    { crate = "tikv-jemalloc-sys@0.7.1+5.3.1-0-g81034ce1f1373e37dc865038e1bc8eeecf559ce8", allow-globs = ["configure/configure", "jemalloc/autogen.sh", "jemalloc/bin/*.in", "jemalloc/build-aux/*", "jemalloc/include/jemalloc/*.sh", "jemalloc/include/jemalloc/internal/*.sh", "jemalloc/scripts/**", "jemalloc/src/ticker.py", "jemalloc/test/**"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
