[package]
name = "edgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Seeded, byte-reproducible test-data generator and dataset converter for searchdump (TST-INF-009, TST-DATA-001/005/010)"
license = "MIT"
publish = false

[lib]
name = "edgen"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
sonic-rs = "0.5.8"
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
zstd = { version = "0.14", default-features = false }
